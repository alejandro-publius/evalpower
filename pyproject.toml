[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "evalpower"
version = "0.1.0"
description = "Does this eval have enough data to support the verdict it just printed?"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "evalpower contributors" }]
keywords = ["evaluation", "statistics", "confidence-interval", "ai-safety", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.21", "pandas>=1.3"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
evalpower = "evalpower.cli:main"

[project.urls]
Homepage = "https://github.com/alejandro-publius/evalpower"

[tool.setuptools]
packages = ["evalpower"]

[tool.pytest.ini_options]
testpaths = ["tests"]
